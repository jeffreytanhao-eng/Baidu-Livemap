[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livemap-geo"
version = "0.1.0"
description = "Livemap constrained walking fabric & isochrone engine"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "shapely>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["geo*"]
